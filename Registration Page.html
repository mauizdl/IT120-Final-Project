<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Son Solar</title>
    <style>
        body { 
            background: linear-gradient(0deg, #ffd56b, #ff9a56, #ff6f91);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .main-title {
            text-align: center;
            margin: 0;
            padding-top: 50px;
            color: #ffffff;
            font-size: 7rem;
            font-family: 'Times New Roman', Times, serif;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
        }
        .sun {
            color: red;
        }
        .son {
            color: orange;
        }
        .solar {
            color: yellow;
        }
        .data-box {
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            padding: 35px 40px;
            border-radius: 16px;
            width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-family: tahoma, sans-serif;
            text-align: left;
            margin-top: 40px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 16px;
        }
        .box-heading {
            margin: 0 0 25px 0;
            font-size: 1.8rem;
            color: #ffffff;
            letter-spacing: 1px;
            text-align: center;
            grid-column: 1 / -1;
        }
        .input-field {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            margin-bottom: 12px;
            border: none;
            border-radius: 6px;
            background-color: #fff8f0;
            color: #333;
            font-family: tahoma, sans-serif;
            font-size: 0.95rem;
        }
        .input-field:focus {
            outline: 2px solid #ff9a56;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        .design-button {
            height: 48px;
            background-color: #fdfd96;
            border-radius: 8px;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000000;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            grid-column: 1 / -1;
            cursor: pointer;
        }
        .design-footer-text {
            text-align: center;
            color: #000000;
            font-size: 0.85rem;
            margin-top: 20px;
            cursor: pointer;
            transition: color 0.2s;
            grid-column: 1 / -1;
        }
        .design-footer-text:hover {
            color: rgb(255,243,136);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1 class="main-title">
    <span class="sun">SUN</span>
    <span class="son">SON</span>
    <span class="solar">SOLAR</span>
    </h1>

    <div class="data-box">
        <div class="box-heading">SIGN UP</div>

        <input class="input-field" type="text" placeholder="First Name" id="firstName">
        <input class="input-field" type="text" placeholder="Last Name" id="lastName">

        <input class="input-field" type="text" placeholder="Middle Name" id="middleName">
        <input class="input-field" type="date" placeholder="Birthdate" id="birthdate">

        <select class="input-field" id="gender">
            <option value="" disabled selected>Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <input class="input-field" type="tel" placeholder="Phone Number" id="telNo">

        <input class="input-field full-width" type="email" placeholder="Email" id="email">
        <input class="input-field full-width" type="text" placeholder="Address" id="address">
        <input class="input-field full-width" type="text" placeholder="Username" id="username">
        <input class="input-field full-width" type="password" placeholder="Password" id="password">

        <div class="design-button" onClick="Click()">SIGN UP</div>

        <div class="design-footer-text">Already have an account?</div>
    </div>


    <script>
        const inputs = document.querySelectorAll('input')
        const user = {
            firstName:"",
            middleName:"",
            lastName:"",
            birthdate:"",
            gender:"",
            telNo:"",
            email:"",
            address:"",
            username:"",
            password:""
        }

        function Click(){
            inputs.forEach(input=>{
                if(input.id){
                    user[input.id] = input.value
                }
            })
            console.log(user)
        }
        
        
       
    </script>
</body>
</html>
